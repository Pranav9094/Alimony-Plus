name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read                # least privilege: CI only reads the repository

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene (secrets, scripts, compose policy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run hygiene checks
        run: bash infra/ci/hygiene.sh

  backend:
    name: Backend (Express + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Create databases with the init script docker compose uses
        run: bash infra/ci/prepare-db.sh
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Start the backend (least-privilege database role)
        working-directory: backend
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          FILE_ENCRYPTION_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$FILE_ENCRYPTION_KEY"
          export JWT_SECRET FILE_ENCRYPTION_KEY
          export DATABASE_URL="postgres://alimony_app:${APP_DB_PASSWORD}@127.0.0.1:5432/alimony"
          export PORT=5000 LOGIN_RATE_LIMIT_MAX=1000 NODE_ENV=production
          nohup node server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/api/health && exit 0
            sleep 1
          done
          echo "::error::backend did not become healthy"; cat "$RUNNER_TEMP/backend.log"; exit 1
      - name: Integration and security tests (IDOR, XSS, privacy, uploads)
        working-directory: backend
        env:
          BASE_URL: http://127.0.0.1:5000
        run: npm test
      - name: Backend log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/backend.log" || true

  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  rag-api:
    name: RAG API (FastAPI + pgvector + Celery + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/rag-api/requirements*.txt
      - name: Create databases with the init script docker compose uses
        run: bash infra/ci/prepare-db.sh
      - name: Install dependencies
        working-directory: services/rag-api
        run: pip install -r requirements-dev.txt
      - name: Tests (unit, database, real Celery worker + Redis)
        working-directory: services/rag-api
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          export TEST_DATABASE_URL="postgresql://rag_app:${RAG_DB_PASSWORD}@127.0.0.1:5432/alimony_rag_test"
          python -m pytest -q -p no:cacheprovider

  docker-stack:
    name: Docker stack on real images (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Informational until it has passed once on GitHub: a failure here is reported but does not block the pull request.
    # Delete the next line to make it a required check.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build, start, health-check and smoke-test the whole stack
        run: bash infra/ci/smoke-stack.sh
