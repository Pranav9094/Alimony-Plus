# Alimony+ local stack.  Usage:  cp .env.example .env  (fill every value)  &&  docker compose up --build
# Only the frontend is published, and only on 127.0.0.1. Database, Redis, backend and the RAG API stay on the internal network.
name: alimony-plus

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  db:
    image: pgvector/pgvector:pg16
    <<: *hardening
    cap_drop: []                      # the postgres entrypoint needs to chown/gosu on first start
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:?set RAG_DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/db/10-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./infra/db/backend_schema.sql:/sql/backend_schema.sql:ro
      - ./backend/prisma/intake.sql:/sql/intake.sql:ro
      - ./backend/prisma/rls.sql:/sql/rls.sql:ro
      - ./services/rag-api/app/schema.sql:/sql/rag_schema.sql:ro
    healthcheck:
      # healthy only after 10-init.sh finished (its last step creates legal_chunks)
      test: ["CMD-SHELL", "psql -U postgres -d alimony_rag -tAc \"select to_regclass('public.legal_chunks') is not null\" | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    <<: *hardening
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    <<: *hardening
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgres://alimony_app:${APP_DB_PASSWORD}@db:5432/alimony
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?set FILE_ENCRYPTION_KEY in .env (64 hex chars)}
    volumes:
      - backend_uploads:/app/uploads      # encrypted user documents

  rag-api:
    build: ./services/rag-api
    <<: *hardening
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://rag_app:${RAG_DB_PASSWORD}@db:5432/alimony_rag
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env (32+ chars)}
      EMBEDDER: none

  frontend:
    build: ./frontend
    <<: *hardening
    depends_on:
      backend: { condition: service_healthy }
    environment:
      BACKEND_URL: http://backend:5000    # server-side only; never exposed to the browser
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db_data:
  redis_data:
  backend_uploads:
